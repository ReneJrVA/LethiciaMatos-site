    <div id="banner">

        </div>

    <div>
        <!-- Mantive o mesmo link do FormSubmit, mas traduzi os atributos 'name' para que você receba o e-mail em português -->
        <form class="form-contant-blok" method="post" action="https://formsubmit.co/lethiciapmatos@gmail.com">
            <div class="titel-form">
                <h1>Entre em contato</h1>
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label"><h2>Seu nome*</h2></label>
                <input type="text" class="form-control" name="Nome" id="exampleInputEmail1" placeholder="Digite seu nome"
                       aria-describedby="emailHelp" required>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label"><h2>Endereço de e-mail*</h2></label>
                <input type="email" class="form-control" name="Email" id="exampleInputPassword1" placeholder="Digite seu e-mail" required>
            </div>
            <div class="blok-check">
                <h2>Em qual ensaio você tem interesse?</h2>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="Tipo de Ensaio" value="Natal" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Natal</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="Tipo de Ensaio" value="Casamento" class="form-check-input" id="exampleCheck2">
                    <label class="form-check-label" for="exampleCheck2">Casamento</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" name="Tipo de Ensaio" value="Gestante"  id="exampleCheck3">
                    <label class="form-check-label" for="exampleCheck3">Gestante</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" name="Tipo de Ensaio" value="Gestante Externa" id="exampleCheck4">
                    <label class="form-check-label" for="exampleCheck4">Gestante externa</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" name="Tipo de Ensaio" value="Familia" id="exampleCheck5">
                    <label class="form-check-label" for="exampleCheck5">Família</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" name="Tipo de Ensaio" value="Retrato" id="exampleCheck6">
                    <label class="form-check-label" id="check-5" for="exampleCheck6">Retrato</label>
                </div>
            </div>
            <label for="exampleInputEmail1" class="form-label"><h2>Como você me conheceu?*</h2></label>
            <select class="form-select" name="Como me conheceu?" aria-label="Default select example" required>
                <option selected>Escolha uma opção</option>
                <option value="Instagram">Instagram</option>
                <option value="Google">Google</option>
                <option value="Anuncio">Anúncio</option>
                <option value="Indicacao de amigo">Indicação de um amigo</option>
                <option value="Outros">Outros</option>
            </select>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" id="bericht" class="form-label"><h2>Mensagem*</h2></label>
                <textarea class="form-control" id="exampleFormControlTextarea1" name="Mensagem" placeholder="Digite sua mensagem"
                          rows="3"></textarea>
            </div>

            <div class="btn-faq-blok">
                <button type="submit" class="btn-faq">Enviar</button>
            </div>
        </form>
    </div>
